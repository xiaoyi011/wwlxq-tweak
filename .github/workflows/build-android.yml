name: build-android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build libawj.so (NDK)
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK=$NDK"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          "$CLANG" -shared -O2 -fPIC -o libawj.so android/jni/awj.c -llog -ldl
          file libawj.so
          ls -l libawj.so

      - name: Build classes.dex
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-30" "build-tools;34.0.0" >/dev/null 2>&1 || true
          mkdir -p classes
          javac -source 8 -target 8 \
            -bootclasspath "$ANDROID_HOME/platforms/android-30/android.jar" \
            -d classes $(find android/java -name '*.java')
          mkdir -p dexout
          "$ANDROID_HOME/build-tools/34.0.0/d8" \
            --lib "$ANDROID_HOME/platforms/android-30/android.jar" \
            --output dexout $(find classes -name '*.class')
          file dexout/classes.dex
          ls -l dexout

      - uses: actions/upload-artifact@v4
        with:
          name: awj-android
          path: |
            libawj.so
            dexout/classes.dex

name: build-android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build libawj.so (NDK)
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK=$NDK"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          "$CLANG" -shared -O2 -fPIC -o libawj.so android/jni/awj.c -llog -ldl
          file libawj.so
          ls -l libawj.so

      - name: Build classes.dex
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "SDK=$SDK"
          ls "$SDK" | head
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          echo "sdkmanager=$SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-30" "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi
          JAR="$SDK/platforms/android-30/android.jar"
          if [ ! -f "$JAR" ]; then JAR=$(find "$SDK/platforms" -name android.jar | sort | tail -1); fi
          echo "JAR=$JAR"
          ls -l "$JAR"
          mkdir -p classes dexout
          javac -source 8 -target 8 -bootclasspath "$JAR" -d classes $(find android/java -name '*.java')
          D8="$SDK/build-tools/34.0.0/d8"
          if [ ! -x "$D8" ]; then D8=$(find "$SDK/build-tools" -name d8 | sort | tail -1); fi
          echo "D8=$D8"
          "$D8" --lib "$JAR" --output dexout $(find classes -name '*.class')
          file dexout/classes.dex
          ls -l dexout

      - uses: actions/upload-artifact@v4
        with:
          name: awj-android
          path: |
            libawj.so
            dexout/classes.dex

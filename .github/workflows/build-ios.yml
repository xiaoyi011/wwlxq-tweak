name: build-ios

on:
  workflow_dispatch:
  push:
    paths:
      - main.m

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld unzip curl
          clang --version | head -2

      - name: Fetch iOS SDK
        run: |
          curl -sL -o sdks.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q sdks.zip
          ls -d sdks-master/iPhoneOS*.sdk | sort -V | tail -3

      - name: Build awj.dylib
        run: |
          set -e
          SDK=$(ls -d sdks-master/iPhoneOS*.sdk | sort -V | tail -1)
          echo "USING $SDK"
          clang -target arm64-apple-ios14.0 -isysroot "$SDK" \
            -fuse-ld=lld -fblocks -fobjc-arc -O2 -dynamiclib \
            -Wl,-undefined,dynamic_lookup \
            -framework UIKit -framework Foundation \
            -o awj.dylib main.m
          file awj.dylib
          ls -l awj.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: awj-dylib
          path: awj.dylib

name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build awj.dylib
        run: |
          set -e
          xcrun --sdk iphoneos clang \
            -arch arm64 -miphoneos-version-min=13.0 \
            -dynamiclib -O2 -fblocks \
            -o awj.dylib main.c
          file awj.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: awj-dylib
          path: awj.dylib
